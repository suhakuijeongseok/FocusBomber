<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing:border-box; }
      body { display:grid; place-items:center; width:440px; height:280px; margin:0; overflow:hidden; color:#fff5db; background:linear-gradient(145deg,#12161d,#261b0c); font-family:Inter,Pretendard,system-ui,sans-serif; }
      main { display:grid; grid-template-columns:120px 1fr; gap:24px; align-items:center; width:380px; }
      img { width:112px; height:112px; image-rendering:pixelated; filter:drop-shadow(8px 10px 0 #0007); }
      h1 { margin:0; color:#ffb516; font-size:37px; letter-spacing:-1.5px; }
      p { margin:10px 0 0; color:#d8cbbb; font-size:16px; line-height:1.45; }
      .pixel { color:#ffca55; font:900 11px ui-monospace,monospace; letter-spacing:.1em; }
    </style>
  </head>
  <body><main><img src="../assets/icons/icon-128.png" alt=""><div><span class="pixel">FOCUS TIMER</span><h1>Focus Bomber</h1><p>시간을 넘기면<br>픽셀 편대가 출동합니다.</p></div></main></body>
</html>
