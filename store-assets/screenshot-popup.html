<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Bomber — 사이트별 시간 제한</title>
    <style>
      * { box-sizing: border-box; }
      body { margin:0; width:1280px; height:800px; overflow:hidden; color:#f6f1e8; background:linear-gradient(135deg,#11151c,#2a2117); font-family:Inter,Pretendard,system-ui,sans-serif; }
      .page { display:grid; grid-template-columns:1fr 410px; gap:54px; align-items:center; width:1120px; height:100%; margin:auto; }
      .copy h1 { margin:0 0 18px; max-width:650px; color:#ffbe29; font-size:68px; line-height:1.02; letter-spacing:-3px; }
      .copy p { max-width:590px; margin:0; color:#c9beb2; font-size:25px; line-height:1.55; }
      .tag { display:inline-block; margin-bottom:22px; padding:8px 13px; border:2px solid #ffb000; color:#ffce63; background:#241b0c; font:900 14px ui-monospace,monospace; }
      .panel { padding:18px; border:1px solid #504234; border-radius:24px; background:#15120f; box-shadow:18px 20px 0 #0006; }
      iframe { display:block; width:360px; height:660px; border:0; border-radius:14px; background:#15120f; }
    </style>
  </head>
  <body>
    <div class="page">
      <section class="copy">
        <span class="tag">FOCUS BOMBER</span>
        <h1>사이트별 시간을 정하고 집중하세요.</h1>
        <p>하루 제한시간을 넘기면 픽셀 편대가 페이지를 정리하고 탭을 닫습니다. 기록은 브라우저 안에만 저장됩니다.</p>
      </section>
      <section class="panel"><iframe src="../popup.html" title="Focus Bomber 설정 화면"></iframe></section>
    </div>
  </body>
</html>
